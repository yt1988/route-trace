<!doctype html>
<html lang="{{lang}}" data-paths="{{pathsAttr}}"{{rootAttr}}>
<head>
<meta charset="utf-8">
<script>{{prepaint}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{head}}
<link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/{{css}}">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="{{homeHref}}" aria-current="page">
      <span class="logo"><img class="logo-light" src="/assets/logo-light.svg" width="90" height="36" alt="1ms" loading="lazy"><img class="logo-dark" src="/assets/logo-dark.svg" width="90" height="36" alt="1ms" loading="lazy"></span>
      <span class="brand-name" data-i="app_name"></span>
    </a>
    <div class="top-acts">
      <label class="sel"><span class="sr" data-i="lang_label"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c2 2 2.8 4 2.8 6.5S10 12.5 8 14.5C6 12.5 5.2 10.5 5.2 8S6 3.5 8 1.5z"/></svg>
        <select id="lang">{{langOpts}}</select>
      </label>
      <button class="icon-btn" id="helpBtn" type="button" aria-haspopup="dialog" aria-controls="help"><span class="sr" data-i="faq_h"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.2a1.8 1.8 0 1 1 2.5 1.7c-.5.2-.8.6-.8 1.1v.4M8 11.3v.1"/></svg>
      </button>
      <a class="icon-btn gh" href="https://github.com/yt1988/route-trace" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .2a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 .2z"/></svg></a>
      <button class="icon-btn" id="theme" type="button" aria-label="{{a:a_theme}}">
        <svg class="i-sys" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/></svg>
        <svg class="i-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg>
        <svg class="i-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.8A5.8 5.8 0 0 1 6.2 2.5a5.8 5.8 0 1 0 7.3 7.3z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- what this is, in plain sight on the first screen (most visitors are on phones) -->
    <div class="intro">
      <h1>{{a:hero_h}}</h1>
      <p class="lead">{{a:lead}}</p>
    </div>
    <!-- 1. one card: the map and the bar that drives it -->
    <section class="card hero" aria-label="{{a:app_name}}">
      <div class="stage">
        <div id="globe" class="globe"></div>
      </div>
      <div class="bar">
        <div class="route">
          <div class="end from">
            <div class="end-k">
              <span class="dir" role="tablist" aria-label="{{a:a_dir}}">
                <button type="button" role="tab" data-dir="out" aria-selected="true" data-i="dir_out"></button><button type="button" role="tab" data-dir="back" aria-selected="false" data-i="dir_back"></button>
              </span>
            </div>
            <button type="button" id="originBtn" class="origin" aria-haspopup="dialog"><span class="m" data-i="me_detecting"></span></button>
          </div>
          <div class="end to">
            <!-- beside the target, once it is filled in: the same address pinged from 18 regions (the shell's
                 <meta name="ping">; a self-hosted copy has no meta and shows no link) -->
            <div class="end-k" id="toK"><span data-i="to_label"></span><a class="ext" id="toPing" target="_blank" rel="noopener" hidden></a></div>
            <div class="to-box">
              <input id="target" autocomplete="off" spellcheck="false" placeholder="{{a:target_ph}}" aria-label="{{a:a_target}}">
              <div id="backBox" class="combo" hidden>
                <input id="backTo" autocomplete="off" spellcheck="false" placeholder="{{a:back_ph}}" aria-label="{{a:a_back_to}}" role="combobox" aria-expanded="false" aria-controls="backList" aria-describedby="backSub">
                <span id="backSub" class="combo-sub m"></span>
                <button type="button" id="backOpen" class="combo-btn" tabindex="-1" aria-label="{{a:a_back_list}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
                <div id="backList" class="combo-list" role="listbox" aria-label="{{a:a_back_list}}" hidden></div>
              </div>
            </div>
          </div>
          <div class="end go-col">
            <button type="button" id="go" class="go" disabled data-i="go"></button>
          </div>
        </div>
        <div class="bar-foot">
          <div id="exits" class="exits m"></div>
          <button type="button" class="opts-btn" id="optsBtn" aria-expanded="false" aria-controls="opts"><span data-i="opts"></span><span class="opts-cur" id="optsCur"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
          <span class="quota m" id="quota"></span>
        </div>
        <div class="opts" id="opts" hidden>
          <div class="opt"><span class="opt-k" data-i="opt_proto"></span><div class="seg2" data-opt="proto" role="radiogroup" aria-label="{{a:opt_proto}}"><button type="button" data-v="ICMP" aria-pressed="true">ICMP</button><button type="button" data-v="TCP:443" aria-pressed="false">TCP 443</button><button type="button" data-v="TCP:80" aria-pressed="false">TCP 80</button><button type="button" data-v="UDP:33434" aria-pressed="false">UDP</button></div></div>
          <div class="opt"><span class="opt-k" data-i="opt_packets"></span><div class="seg2" data-opt="packets" role="radiogroup" aria-label="{{a:opt_packets}}"><button type="button" data-v="5" aria-pressed="false">5</button><button type="button" data-v="10" aria-pressed="true">10</button><button type="button" data-v="16" aria-pressed="false">16</button></div></div>
          <div class="opt"><span class="opt-k" data-i="opt_ip"></span><div class="seg2" data-opt="ipv" role="radiogroup" aria-label="{{a:a_ipv}}"><button type="button" data-v="" aria-pressed="true" data-i="opt_auto"></button><button type="button" data-v="4" aria-pressed="false">IPv4</button><button type="button" data-v="6" aria-pressed="false">IPv6</button></div></div>
        </div>
      </div>
    </section>

    <!-- 2. the path, in order -->
    <section id="result" class="card path" hidden aria-label="{{a:a_path}}" aria-live="polite"></section>
  </main>
  <!-- the shell puts the list of the other 1ms.dog tools here (tool-contract §4), before the dialogs -->
  <div data-ms-more></div>
</div>

<!-- questions behind the "?" button: the list on the left, one answer at a time (tool-contract §4) -->
<dialog id="help" class="help" aria-label="{{a:faq_h}}">
  <div class="help-h"><b data-i="faq_h"></b><button type="button" class="pk-close" id="helpClose" aria-label="{{a:a_close}}">✕</button></div>
  <div class="help-sel"><select id="helpSel" aria-label="{{a:a_q}}"></select><button type="button" id="helpPrev" aria-label="{{a:a_prev}}">‹</button><button type="button" id="helpNext" aria-label="{{a:a_next}}">›</button></div>
  <div class="help-b">
    <nav class="help-nav" id="helpNav" role="tablist" aria-label="{{a:a_q}}"></nav>
    <div class="help-a" id="helpA">{{helpC}}</div>
  </div>
</dialog>

<dialog id="picker" class="picker" aria-label="{{a:a_picker}}">
  <div class="pk-head">
    <div class="pk-search">
      <input id="pkQ" type="search" autocomplete="off" spellcheck="false" placeholder="{{a:pk_ph}}">
      <button type="button" class="pk-close" id="pkClose" aria-label="{{a:a_close}}">✕</button>
    </div>
    <div class="pk-bar">
      <div class="seg" id="pkRef" role="radiogroup" aria-label="{{a:a_ref}}"></div>
      <div class="seg" id="pkType" role="radiogroup" aria-label="{{a:a_type}}">
        <button type="button" data-v="" aria-pressed="true" data-i="pk_all"></button>
        <button type="button" data-v="e" aria-pressed="false" data-i="pk_eye"></button>
        <button type="button" data-v="d" aria-pressed="false" data-i="pk_dc"></button>
      </div>
    </div>
  </div>
  <div class="pk-body">
    <div class="pk-list" id="pkList" role="listbox" aria-label="{{a:a_probes}}"></div>
    <div class="pk-map" id="pkMap"></div>
  </div>
  <div class="pk-foot m" id="pkFoot"></div>
</dialog>

<script src="/assets/vendor/d3.min.js"></script>
<script src="/assets/vendor/topojson-client.min.js"></script>
<script src="/assets/{{strings}}"></script>
<script src="/assets/{{js}}"></script>
</body>
</html>
